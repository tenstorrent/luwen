name: Build

on:
  workflow_call:
    inputs:
      ref:
        default: ${{ github.ref }}
        required: false
        type: string
      upload:
        default: false
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      upload:
        description: Upload artifacts
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:

  # Build Rust crates
  rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace

  # Build Python wheels.
  #
  # x86_64 wheels are built natively in the manylinux_2_28 image. riscv64 wheels are
  # cross-compiled from the x86_64 runner with maturin's manylinux_2_31 cross image;
  # the build script (and therefore protoc-bin-vendored) runs on the x86_64 host, so no
  # riscv64 protoc is needed.
  py:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            target: x86_64
            manylinux: 2_28
            args: >-
              --release --out dist
              -m bind/pyluwen/Cargo.toml
              --interpreter python3.10
            artifact: wheels-cp310
          - python-version: "3.11"
            target: x86_64
            manylinux: 2_28
            args: >-
              --release --sdist --out dist
              -m bind/pyluwen/Cargo.toml
              --features abi3-py311
            artifact: wheels-abi3
          - python-version: "3.10"
            target: riscv64
            manylinux: 2_31
            args: >-
              --release --out dist
              -m bind/pyluwen/Cargo.toml
              --interpreter python3.10
            artifact: wheels-cp310-riscv64
          - python-version: "3.11"
            target: riscv64
            manylinux: 2_31
            args: >-
              --release --out dist
              -m bind/pyluwen/Cargo.toml
              --features abi3-py311
            artifact: wheels-abi3-riscv64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: ${{ matrix.args }}
          before-script-linux: |
            # manylinux_2_28 images are dnf based, the rust-cross images are apt based.
            if command -v dnf >/dev/null; then
              dnf install -y protobuf-compiler
            else
              apt-get update && apt-get install -y protobuf-compiler
            fi
      - name: Store wheel
        if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist
