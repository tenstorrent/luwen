name: Build

on:
  workflow_call:
    inputs:
      ref:
        default: ${{ github.ref }}
        required: false
        type: string
      upload:
        default: false
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      upload:
        description: Upload artifacts
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:

  # Build Rust crates
  rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace

  # Build Python wheels.
  #
  # x86_64 wheels are built natively in the manylinux_2_28 image. riscv64 wheels are
  # cross-compiled from the x86_64 runner with maturin's manylinux_2_31 cross image.
  py:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # python-version is a bit misleading. ABI is what we actually care about
        # so these are really cp310 and abi3.
        python-version: ["3.10", "3.11"]
        target: ["x86_64", "riscv64", "aarch64"]

        include:
          # Set abi parameters from python-version.
          - python-version: "3.10"
            abi-args: "--interpreter 3.10"
            wheel-abi-name: cp310
          - python-version: "3.11"
            abi-args: "--features abi3-py311"
            wheel-abi-name: abi3

          # Set manylinux from target.
          - target: x86_64
            manylinux: 2_28
          - target: riscv64
            manylinux: 2_31 # see https://github.com/PyO3/maturin-action#manylinux-docker-container
          - target: aarch64
            manylinux: 2_28

          # Set wheel target suffix based on target.
          - target: riscv64
            wheel-target-suffix: -riscv64
          - target: aarch64
            wheel-target-suffix: -aarch64

          # Use x86-64/3.11 build to build source dist once.
          - python-version: "3.11"
            target: x86_64
            sdist: --sdist
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -m bind/pyluwen/Cargo.toml ${{ matrix.abi-args }}
      - name: Store wheel
        if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.wheel-abi-name }}${{ matrix.wheel-target-suffix }}
          path: dist
