name: bh-mod

# Build the bh-mod CLI as a standalone release binary. On every PR it is
# uploaded as a workflow artifact; on a published release it is attached to the
# release as a downloadable asset.

on:
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Build the tag on a release, otherwise the triggering ref.
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build bh-mod
        run: cargo build --release -p bh-mod
      - name: Smoke test
        run: ./target/release/bh-mod --version
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bh-mod
          path: target/release/bh-mod
          if-no-files-found: error

  # Attach the binary to the GitHub Release.
  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bh-mod
          path: dist
      - name: Attach bh-mod to release
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" dist/bh-mod \
            --clobber --repo "${{ github.repository }}"
