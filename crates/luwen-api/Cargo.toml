[package]
name = "luwen-api"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = """
High-level interface for Tenstorrent device interactions
"""
readme = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bincode = { workspace = true }
bitfield-struct = { workspace = true }
bytemuck = { version = "1.22.0", features = ["derive"] }
crc32fast = "1.5.0"
luwen-def = { workspace = true }
num-derive = "0.4.2"
num-traits = "0.2.19"
once_cell = "1.19.0"
prost = "0.13.5"
rust-embed = { version = "8.0.0", features = ["interpolate-folder-path"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing.workspace = true

[build-dependencies]
home = { version = "=0.5.5", default-features = false }
prost-build = "0.13.5"

# protoc-bin-vendored repackages Google's official protoc release binaries, which exist for
# x86_64/aarch64/ppc64le/s390x but not riscv64. On riscv64 hosts build protoc from source
# (protobuf-src, needs cmake and a C++17 compiler) so the build stays self-contained.
[target.'cfg(not(target_arch = "riscv64"))'.build-dependencies]
protoc-bin-vendored = "3.2.0"

[target.'cfg(target_arch = "riscv64")'.build-dependencies]
protobuf-src = "2.1"
